name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check syntax
        run: |
          python -m compileall -q -x "(\.venv|node_modules|\.git)" .
          for f in static/*.js tests/*.cjs; do
            node --check "$f"
          done
      - name: Run tests
        run: python -m pytest -p no:cacheprovider -q

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt pip-audit
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t algorithm-notebook:ci .
      - name: Start container
        run: docker run -d --name nb -p 8000:8000 -e INVITE_CODE=ci-invite -e COOKIE_SECURE=0 algorithm-notebook:ci
      - name: Wait for database health
        run: |
          if timeout 30s bash -c '
            until curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:8000/healthz; do
              sleep 1
            done
          '; then
            exit 0
          fi
          docker logs nb
          exit 1
